{% extends "Submissions/base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<h1 class="page-title">Forgot Password</h1>
<p class="page-subtitle">Enter your email to receive a password reset OTP.</p>

{% if messages %}
  {% for message in messages %}
    <div class="banner {% if message.tags == 'success' %}success{% elif message.tags == 'warning' %}warn{% elif message.tags == 'error' %}error{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<div class="card">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required placeholder="Enter your registered email" autofocus>
    </div>

    <div class="row" style="margin-top: 20px;">
      <button type="submit" class="btn primary">Send OTP</button>
      <a class="btn secondary" href="{% url 'verify_password' %}">Back</a>
    </div>
  </form>
</div>

<style>
  .form-group {
    margin-bottom: 16px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }
  
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
  }
  
  .row {
    display: flex;
    gap: 10px;
  }
</style>
{% endblock %}
