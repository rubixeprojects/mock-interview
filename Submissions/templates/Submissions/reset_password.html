{% extends "Submissions/base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<h1 class="page-title">Reset Password</h1>
<p class="page-subtitle">Set your new password.</p>

{% if messages %}
  {% for message in messages %}
    <div class="banner {% if message.tags == 'success' %}success{% elif message.tags == 'warning' %}warn{% elif message.tags == 'error' %}error{% endif %}">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<div class="card">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" value="{{ email }}" disabled style="background-color: #f0f0f0; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label for="password">New Password:</label>
      <input type="password" id="password" name="password" required placeholder="Enter your new password" autofocus>
      <small>Minimum 6 characters</small>
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirm Password:</label>
      <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your new password">
    </div>

    <div class="row" style="margin-top: 20px;">
      <button type="submit" class="btn primary">Reset Password</button>
      <a class="btn secondary" href="{% url 'forgot_password' %}">Back</a>
    </div>
  </form>
</div>

<style>
  .form-group {
    margin-bottom: 16px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }
  
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
  }
  
  .form-group small {
    display: block;
    color: #666;
    font-size: 12px;
    margin-top: 4px;
  }
  
  .row {
    display: flex;
    gap: 10px;
  }
</style>
{% endblock %}
