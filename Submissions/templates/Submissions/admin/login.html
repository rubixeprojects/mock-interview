{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-case=1"/>
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family: Inter, sans-serif;
      background: linear-gradient(135deg, #1170ff 0%, #2c86ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-box{
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      width: 100%;
      max-width: 420px;
    }
    
    .brand-badge{
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1170ff, #2c86ff);
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #fff;
      font-size: 20px;
      margin: 0 auto 20px;
    }
    
    h1{
      margin: 0 0 10px;
      font-size: 32px;
      color: #0f172a;
      text-align: center;
    }
    
    p{
      margin: 0 0 30px;
      color: #64748b;
      font-weight: 600;
      text-align: center;
    }
    
    label{
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    
    input{
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      transition: .15s;
      box-sizing: border-box;
    }
    
    input:focus{
      border-color: #1170ff;
      box-shadow: 0 0 0 4px rgba(17,112,255,.12);
    }
    
    input[readonly]{
      background: #f8fafc;
      color: #64748b;
    }
    
    button{
      width: 100%;
      padding: 14px;
      background: #1170ff;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: .15s;
    }
    
    button:hover{
      filter: brightness(.95);
      transform: translateY(-1px);
    }
    
    .error{
      background: rgba(239,68,68,.12);
      color: #dc2626;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 14px;
    }
    
    .success{
      background: rgba(16,185,129,.12);
      color: #059669;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    
    .back-link{
      text-align: center;
      margin-top: 20px;
    }
    
    .back-link a{
      color: #1170ff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    
    .back-link a:hover{
      text-decoration: underline;
    }

    .hint{
      font-size: 12px;
      color: #64748b;
      margin-top: -10px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand-badge">AP</div>
    <h1>Admin Portal</h1>
    <p>🔒 Secure Access</p>
    
    {% if messages %}
      {% for message in messages %}
        <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    
    <form method="POST">
      {% csrf_token %}
      
      <label>Username / Email</label>
      <input 
        type="text" 
        name="email" 
        value="{{ prefilled_email }}" 
        {% if prefilled_email %}readonly{% endif %}
        placeholder="Enter username or email" 
        required 
        {% if not prefilled_email %}autofocus{% endif %}
      >
      <div class="hint">Superadmin: use username | Admin: use email</div>
      
      <label>Password</label>
      <input 
        type="password" 
        name="password" 
        placeholder="Enter your password" 
        required 
        {% if prefilled_email %}autofocus{% endif %}
      >
      
      <button type="submit">Login to Admin Panel</button>
    </form>
    
    <div class="back-link">
      <a href="{% url 'reset_session' %}">← Back to Home</a>
    </div>
  </div>
</body>
</html>
